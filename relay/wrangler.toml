# Le relais du duel en ligne de Panache (README.md) : un salon par code de 4 lettres, un Durable Object qui fait passer
# les paquets entre l'hôte et l'invité. Pas de boucle de jeu ici : le salon hiberne entre deux messages.
# Mise en ligne : npx wrangler deploy (depuis ce dossier, CLOUDFLARE_API_TOKEN dans l'environnement)
name = "panache-relais"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "SALON"
class_name = "Salon"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salon"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# Les comptes et leurs sauvegardes (src/comptes.ts, README.md « Comptes ») ; le schéma est dans migrations/
# (npx wrangler d1 migrations apply panache-comptes --remote).
[[d1_databases]]
binding = "DB"
database_name = "panache-comptes"
database_id = "dd4422d8-6794-4b74-b71c-e8cf70f246d0"
migrations_dir = "migrations"

# Au plus 5 comptes créés par minute et par adresse.
[[ratelimits]]
name = "CREATION"
namespace_id = "4301"
simple = { limit = 5, period = 60 }
